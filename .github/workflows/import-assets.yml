name: Import public site media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-assets.yml'

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified source images from owned WordPress site
        run: bash scripts/import-public-site-media.sh
      - name: Commit images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/source-web/
          if git diff --cached --quiet; then
            echo "No new media assets"
          else
            git commit -m "assets: import existing site photography and branding"
            git push
          fi
